services:
  addon:
    build: .
    ports:
      - "7146:7146"
    environment:
      # LETTERBOXD_USERNAME: your-username
      # TMDB_API_KEY: ""
      # TOP250_SNAPSHOT_URL: ""
      # CATALOG_NAME: "IMDb Top 250 — À voir"
