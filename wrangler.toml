name = "stremio-top250-unseen"
main = "src/runtime/worker.ts"
compatibility_date = "2026-09-01"

kv_namespaces = [
  { binding = "CACHE", id = "REPLACE_ME", preview_id = "REPLACE_ME" }
]

# serves public/configure.js
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = false

